name: Release

# Builds the desktop apps and attaches them to a GitHub Release.
# Triggers only on version tags (e.g. `git tag v0.1.0 && git push origin v0.1.0`),
# so it stays well within the free-plan Actions budget. Can also be run manually.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write # needed to create the Release and upload assets

env:
  GO_VERSION: "1.23"
  NODE_VERSION: "20"
  WAILS_VERSION: "v2.12.0"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Fetch ffmpeg (bundled into the .app)
        run: ./scripts/fetch-ffmpeg.sh darwin

      - name: Build universal .app
        run: wails build -platform darwin/universal -clean

      - name: Package .dmg
        run: |
          hdiutil create -volname VideoForge \
            -srcfolder "build/bin/VideoForge.app" \
            -ov -format UDZO "VideoForge-macos-universal.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: VideoForge-macos-universal.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install NSIS (for the installer)
        run: choco install nsis -y

      - name: Fetch ffmpeg (bundled into the installer)
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-ffmpeg.ps1

      - name: Build NSIS installer
        run: wails build -platform windows/amd64 -nsis -clean

      - name: Rename installer
        shell: bash
        run: mv build/bin/VideoForge-amd64-installer.exe VideoForge-windows-amd64-installer.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: VideoForge-windows-amd64-installer.exe
          if-no-files-found: error

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    # Only publish a Release for real tag pushes (manual runs just produce artifacts).
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
          fail_on_unmatched_files: true
